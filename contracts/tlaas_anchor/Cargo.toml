[package]
name = "tlaas_anchor"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib -> the deployable .wasm;  rlib -> lets `cargo test` link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21"

[dev-dependencies]
soroban-sdk = { version = "21", features = ["testutils"] }

[profile.release]
opt-level = "z"        # smallest binary -> lowest on-chain storage cost
overflow-checks = true
debug = 0
strip = "symbols"
codegen-units = 1
lto = true
panic = "abort"
